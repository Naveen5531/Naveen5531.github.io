.lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.board-h { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 8px; font-weight: 700; } .board-h .mini { font-weight: 400; }

.perm-tab td { background: var(--surface-2); }

.who-menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; font: 600 .9rem var(--body); color: var(--ink); cursor: pointer; }
.who-menu button:hover { background: var(--surface-2); } .who-menu button svg { width: 16px; height: 16px; } .who-menu .out { color: var(--bad); }
.dir-list { display: grid; gap: 8px; } .dir-row { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit; }
.dir-row:hover, .dir-row[aria-current="true"] { outline: 2px solid var(--accent); } .dir-row .grow { display: grid; gap: 1px; min-width: 0; } .dir-row .mini { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir-av { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #25cf9f, #0c9b76); color: #fff; display: grid; place-items: center; font: 800 1.05rem var(--display); flex: none; } .dir-av.sm { width: 36px; height: 36px; border-radius: 11px; font-size: .8rem; }
.dir-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; } .dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 12px; }

<style>
/* Layout: left command rail (modules with their sub-tabs nested beneath), slim top bar with page title, tracking search and user; content canvas of cards and tables; records open in a right-hand sheet. Four skins re-dress the same structure. */
:root {
  /* Skin 1 · Midnight Glass (default) */
  --canvas: #070b18; --canvas-img: radial-gradient(1200px 600px at 85% -10%, rgba(34, 211, 238, .14), transparent 60%), radial-gradient(900px 500px at 10% 0%, rgba(167, 139, 250, .14), transparent 55%), #070b18;
  --surface: rgba(255, 255, 255, .045); --surface-solid: #0f1630; --surface-2: rgba(255, 255, 255, .06); --field: rgba(255, 255, 255, .05);
  --ink: #e9eefc; --ink-2: #c8d1ea; --muted: #8b97b8; --line: rgba(255, 255, 255, .09); --line-2: rgba(255, 255, 255, .14);
  --side: rgba(6, 10, 22, .85); --side-ink: #a9b4d0; --side-head: #ffffff; --side-active: rgba(34, 211, 238, .12); --side-active-ink: #67e8f9; --side-sub: #8794b6; --side-line: rgba(255, 255, 255, .07);
  --accent: #22d3ee; --accent-ink: #03141b; --accent-soft: rgba(34, 211, 238, .14); --accent-2: #a78bfa; --ic-bg: linear-gradient(135deg, rgba(34, 211, 238, .22), rgba(167, 139, 250, .22));
  --good: #34d399; --good-bg: rgba(52, 211, 153, .14); --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .14); --bad: #fb7185; --bad-bg: rgba(251, 113, 133, .14); --info: #7aa7ff; --info-bg: rgba(122, 167, 255, .14);
  --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 10px 30px rgba(0, 0, 0, .35); --shadow-lg: 0 30px 80px rgba(0, 0, 0, .6); --blur: blur(14px);
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px; --r-sm: 10px; --head-case: none; --head-track: -.01em; --kpi-size: 1.55rem;
  color-scheme: dark;
}
/* Skin 2 · Executive Gold */
body[data-skin="executive"] {
  --canvas: #f3f4f6; --canvas-img: #f3f4f6; --surface: #ffffff; --surface-solid: #ffffff; --surface-2: #f7f7f8; --field: #ffffff;
  --ink: #111113; --ink-2: #2f2f35; --muted: #6b6b75; --line: #e6e6ea; --line-2: #d6d6dc;
  --side: #0b0b0c; --side-ink: #a9a9b1; --side-head: #ffffff; --side-active: rgba(201, 152, 54, .16); --side-active-ink: #e3b65a; --side-sub: #8c8c95; --side-line: rgba(255, 255, 255, .07);
  --accent: #b8862b; --accent-ink: #ffffff; --accent-soft: #f6eedd; --accent-2: #111113; --ic-bg: #f6eedd;
  --good: #1d7a46; --good-bg: #e5f4ea; --warn: #9a6200; --warn-bg: #fdf1dc; --bad: #b42a24; --bad-bg: #fbe7e5; --info: #33539e; --info-bg: #e8eefb;
  --shadow: 0 1px 2px rgba(17, 17, 19, .05); --shadow-lg: 0 30px 70px rgba(17, 17, 19, .25); --blur: none;
  --display: "Fraunces", Georgia, serif; --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px; --r-sm: 8px; --kpi-size: 1.7rem; color-scheme: light;
}
/* Skin 3 · Aurora */
body[data-skin="aurora"] {
  --canvas: #f5f6fb; --canvas-img: radial-gradient(900px 420px at 100% 0%, rgba(236, 72, 153, .08), transparent 60%), radial-gradient(800px 420px at 30% 0%, rgba(99, 102, 241, .1), transparent 60%), #f5f6fb;
  --surface: #ffffff; --surface-solid: #ffffff; --surface-2: #f4f3fb; --field: #ffffff;
  --ink: #1b1640; --ink-2: #352f63; --muted: #6e6a92; --line: #ebe9f6; --line-2: #dcd8ef;
  --side: linear-gradient(165deg, #4338ca 0%, #6d28d9 52%, #be185d 100%); --side-ink: rgba(255, 255, 255, .78); --side-head: #ffffff; --side-active: rgba(255, 255, 255, .2); --side-active-ink: #ffffff; --side-sub: rgba(255, 255, 255, .72); --side-line: rgba(255, 255, 255, .14);
  --accent: #6d28d9; --accent-ink: #ffffff; --accent-soft: #efe9fd; --accent-2: #ec4899; --ic-bg: linear-gradient(135deg, #6366f1, #ec4899);
  --good: #0f8a55; --good-bg: #e2f6ec; --warn: #a15c00; --warn-bg: #fff1dc; --bad: #c42a4b; --bad-bg: #fde7ec; --info: #4f46e5; --info-bg: #ebebfd;
  --shadow: 0 2px 4px rgba(27, 22, 64, .04), 0 12px 32px rgba(76, 29, 149, .08); --shadow-lg: 0 30px 80px rgba(27, 22, 64, .3); --blur: none;
  --display: "Outfit", "Segoe UI", system-ui, sans-serif; --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  --r: 20px; --r-sm: 12px; --kpi-size: 1.65rem; color-scheme: light;
}
/* Skin 4 · Industrial */
body[data-skin="industrial"] {
  --canvas: #e9ebec; --canvas-img: #e9ebec; --surface: #ffffff; --surface-solid: #ffffff; --surface-2: #f3f4f5; --field: #ffffff;
  --ink: #16191c; --ink-2: #2c3136; --muted: #5f676f; --line: #dde0e3; --line-2: #c9cdd1;
  --side: #1b1f23; --side-ink: #a8b0b8; --side-head: #ffffff; --side-active: #ff6a13; --side-active-ink: #ffffff; --side-sub: #8f98a1; --side-line: rgba(255, 255, 255, .08);
  --accent: #ff6a13; --accent-ink: #ffffff; --accent-soft: #ffeadb; --accent-2: #16191c; --ic-bg: #16191c;
  --good: #187a3e; --good-bg: #e2f3e8; --warn: #9a5800; --warn-bg: #fff0d9; --bad: #c22f1f; --bad-bg: #fde6e2; --info: #2b5aa8; --info-bg: #e5edf9;
  --shadow: none; --shadow-lg: 0 24px 60px rgba(0, 0, 0, .3); --blur: none;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --r: 4px; --r-sm: 3px; --head-case: uppercase; --head-track: .04em; --kpi-size: 2rem; color-scheme: light;
}

/* Skin 5 · Punch – same look as the Punch app: light grey canvas, white rounded cards, green for "in", orange for "out" */
body[data-skin="punch"] {
  --canvas: #f2f3f7; --canvas-img: #f2f3f7; --surface: #ffffff; --surface-solid: #ffffff; --surface-2: #f3f4f8; --field: #f8f9fb;
  --ink: #101828; --ink-2: #344054; --muted: #6b7280; --line: #e9ebf1; --line-2: #dfe2ea;
  --side: #ffffff; --side-ink: #475467; --side-head: #101828; --side-active: rgba(12, 155, 118, .1); --side-active-ink: #0a7d5f; --side-sub: #6b7280; --side-line: #e9ebf1;
  --accent: #0c9b76; --accent-ink: #ffffff; --accent-soft: rgba(12, 155, 118, .1); --accent-2: #f26a1b; --ic-bg: rgba(12, 155, 118, .1);
  --good: #0a7d5f; --good-bg: #e3f6ef; --warn: #b54708; --warn-bg: #fff4e5; --bad: #d92d20; --bad-bg: #fdecea; --info: #3557b5; --info-bg: #eaf0fc;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px -12px rgba(16, 24, 40, .12); --shadow-lg: 0 30px 70px rgba(16, 24, 40, .25); --blur: none;
  --display: "Bricolage Grotesque", -apple-system, system-ui, sans-serif; --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 22px; --r-sm: 14px; --kpi-size: 1.75rem; color-scheme: light;
}
body[data-skin="punch"] .brand-mark { background: linear-gradient(135deg, #25cf9f, #0c9b76); color: #fff; font: 800 .9rem var(--display); }
body[data-skin="punch"] .mod .count { background: #f26a1b; }
body[data-skin="punch"] .btn { border-radius: 999px; }
body[data-skin="punch"] .btn.primary { background: #0c9b76; border-color: #0c9b76; color: #fff; }
body[data-skin="punch"] .panel, body[data-skin="punch"] .kpi, body[data-skin="punch"] .tablewrap { border-color: transparent; box-shadow: var(--shadow); }
body[data-skin="punch"] .kpi .v { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; }
body[data-skin="punch"] .titles h1, body[data-skin="punch"] .panel h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; }
body[data-skin="punch"] .side { box-shadow: 1px 0 0 var(--line); }
body[data-skin="punch"] .pcard { border-radius: 18px; border-color: transparent; box-shadow: var(--shadow); }
body[data-skin="punch"] .pill { border-radius: 99px; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--canvas-img); background-color: var(--canvas); background-attachment: fixed; color: var(--ink); font: 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select option { background: var(--surface-solid); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; border-right: 1px solid var(--side-line); backdrop-filter: var(--blur);
  padding-left: env(safe-area-inset-left, 0px); scrollbar-width: thin; }
.brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px 16px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
body[data-skin="aurora"] .brand-mark { background: rgba(255, 255, 255, .2); color: #fff; }
body[data-skin="midnight"] .brand-mark, body:not([data-skin]) .brand-mark { background: linear-gradient(135deg, #22d3ee, #a78bfa); box-shadow: 0 8px 22px rgba(34, 211, 238, .35); }
.brand-name { font: 700 1.02rem/1.15 var(--display); color: var(--side-head); text-transform: var(--head-case); letter-spacing: var(--head-track); }
.brand-sub { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
.nav { padding: 6px 10px 18px; display: grid; gap: 2px; }
.nav-label { font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; opacity: .55; padding: 14px 10px 6px; }
.mod { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; color: inherit; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; font-weight: 600; font-size: .9rem; }
.mod svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.mod .chev { margin-left: auto; width: 14px; height: 14px; opacity: .5; transition: transform .2s; }
.mod:hover { background: var(--side-line); color: var(--side-head); }
.mod[aria-expanded="true"] { color: var(--side-head); }
.mod[aria-expanded="true"] .chev { transform: rotate(90deg); }
.mod .count { font: 600 .66rem var(--mono); background: var(--accent-2); color: #fff; padding: 1px 6px; border-radius: 9px; }
body[data-skin="industrial"] .mod .count { background: #ff6a13; }
body[data-skin="executive"] .mod .count { background: #b8862b; }
.subs { display: grid; gap: 1px; margin: 2px 0 6px 19px; padding-left: 12px; border-left: 1px solid var(--side-line); }
.sub { display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--side-sub); padding: 7px 10px; border-radius: var(--r-sm); text-align: left; font-size: .84rem; font-weight: 500; width: 100%; }
.sub:hover { color: var(--side-head); background: var(--side-line); }
.mod[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); }
.sub[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); font-weight: 600; }
.sub .n { margin-left: auto; font: 500 .68rem var(--mono); opacity: .8; }
.side-foot { margin-top: auto; padding: 14px 18px 18px; border-top: 1px solid var(--side-line); display: grid; gap: 8px; }
.skinrow { display: flex; gap: 6px; }
.skinrow button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.skinrow button[aria-pressed="true"] { border-color: var(--side-head); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding-block: 16px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--canvas) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.gut { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.burger { display: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; place-items: center; flex: none; }
.titles { min-width: 0; flex: 1; }
.crumb { font-size: .74rem; color: var(--muted); letter-spacing: .04em; font-weight: 600; text-transform: uppercase; }
.titles h1 { font: 700 1.45rem/1.2 var(--display); margin: 2px 0 0; letter-spacing: var(--head-track); text-transform: var(--head-case); text-wrap: balance; }
body[data-skin="industrial"] .titles h1 { font-size: 1.8rem; }
.track { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 4px 4px 4px 12px; width: min(380px, 40vw); backdrop-filter: var(--blur); }
.track svg { width: 16px; height: 16px; opacity: .6; flex: none; }
.track input[type=search] { border: 0; background: none; padding: 7px 0; flex: 1; min-width: 0; width: auto; box-shadow: none; outline: none; }
.track button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 7px 13px; font-weight: 600; }
.who { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.who img { width: 32px; height: 32px; border-radius: 50%; }

.content { padding-block: 22px 70px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.banner { border-radius: var(--r-sm); padding: 11px 14px; background: var(--warn-bg); color: var(--warn); font-weight: 500; }
.banner.info { background: var(--info-bg); color: var(--info); }
.help { color: var(--muted); font-size: .86rem; margin: 0; max-width: 80ch; }

input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--field); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 11px; min-width: 0; width: 100%; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 76px; resize: vertical; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: border-color .15s; backdrop-filter: var(--blur); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
body[data-skin="aurora"] .btn.primary { background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #ec4899); border-color: transparent; box-shadow: 0 8px 20px rgba(139, 92, 246, .3); }

.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: default; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; box-shadow: var(--shadow); backdrop-filter: var(--blur); transition: transform .12s, border-color .12s; }
button.kpi:hover { border-color: var(--accent); transform: translateY(-2px); }
.kpi .ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--ic-bg); color: var(--accent); }
body[data-skin="aurora"] .kpi .ic, body[data-skin="industrial"] .kpi .ic { color: #fff; }
body[data-skin="industrial"] .kpi .ic { border-radius: 3px; color: #ff6a13; }
.kpi .ic svg { width: 20px; height: 20px; }
.kpi .v { font: 700 var(--kpi-size)/1.05 var(--display); font-variant-numeric: tabular-nums; letter-spacing: var(--head-track); }
.kpi .l { color: var(--muted); font-size: .78rem; font-weight: 500; grid-column: 2; }
.kpi.alert .v { color: var(--bad); } .kpi.okay .v { color: var(--good); }
.kpi-group { display: grid; gap: 10px; }
.kpi-title { font: 600 .7rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; box-shadow: var(--shadow); backdrop-filter: var(--blur); }
.panel h2 { font: 600 1.05rem/1.2 var(--display); margin: 0 0 14px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; text-transform: var(--head-case); letter-spacing: var(--head-track); }
body[data-skin="industrial"] .panel h2 { font-size: 1.25rem; }
.panel h2 small { font: 500 .78rem var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.leg { border-radius: var(--r-sm); background: var(--surface-2); padding: 12px; display: grid; gap: 6px; border: 1px solid transparent; text-align: left; }
.leg:hover { border-color: var(--accent); }
.leg b { font: 700 1.55rem/1 var(--display); font-variant-numeric: tabular-nums; }
.leg span { font-size: .74rem; color: var(--muted); font-weight: 600; }
.leg i { display: block; height: 5px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }

.leg.ex i em { background: var(--bad); }
.stages-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: .78rem; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tick { fill: var(--muted); font: 500 10px var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .hit:hover + .bar { fill: var(--accent-2); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface-solid); padding: 6px 10px; border-radius: 8px; font-size: .78rem; z-index: 40; }
.attn { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.attn li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: var(--r-sm); background: var(--surface-2); cursor: pointer; min-width: 0; }
.attn li:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.attn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pl div { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.pl b { display: block; font: 700 1.3rem/1.15 var(--display); font-variant-numeric: tabular-nums; }
.pl span { font-size: .76rem; color: var(--muted); }
.empty { color: var(--muted); padding: 26px 18px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--surface); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .search { flex: 1 1 240px; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 20px; padding: 5px 12px; font-size: .79rem; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
body[data-skin="industrial"] .chip { border-radius: 3px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .n { font-family: var(--mono); font-weight: 500; opacity: .7; margin-left: 5px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: var(--blur); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }
.code { font-family: var(--mono); font-size: .8rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--info-bg); color: var(--info); white-space: nowrap; }
body[data-skin="industrial"] .pill { border-radius: 2px; text-transform: uppercase; letter-spacing: .04em; font-size: .68rem; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.neutral { background: var(--surface-2); color: var(--muted); }
.foot { color: var(--muted); font-size: .8rem; display: flex; gap: 14px; flex-wrap: wrap; }

.scrim { position: fixed; inset: 0; background: rgba(4, 7, 16, .55); backdrop-filter: blur(3px); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--surface-solid); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); border-left: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dhead { display: flex; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.dhead h3 { font: 700 1.2rem/1.2 var(--display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; text-transform: var(--head-case); letter-spacing: var(--head-track); }
.dbody { flex: 1; overflow-y: auto; padding: 18px 22px; display: grid; gap: 16px; align-content: start; grid-template-columns: minmax(0, 1fr); }
.dfoot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form label { display: grid; gap: 5px; font-size: .76rem; font-weight: 600; color: var(--muted); min-width: 0; }
.form label.wide { grid-column: 1 / -1; }
.form .req::after { content: " *"; color: var(--bad); }
.quick { grid-column: 1 / -1; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 10px; }
.quick .form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.stepper { display: flex; gap: 4px; flex-wrap: wrap; }
.stepper span { font-size: .72rem; padding: 4px 9px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.stepper span.done { background: var(--accent-soft); color: var(--accent); }
.stepper span.now { background: var(--accent); color: var(--accent-ink); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--line); display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.timeline .when { font-size: .74rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { background: var(--bad-bg); color: var(--bad); border-radius: var(--r-sm); padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.section-title { font: 600 .95rem var(--display); margin: 0; text-transform: var(--head-case); letter-spacing: var(--head-track); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface-solid); padding: 11px 18px; border-radius: 12px; z-index: 50; font-weight: 500; max-width: calc(100% - 32px); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.lane { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; max-height: 70vh; overflow-y: auto; }
.lane h3 { margin: 0; font: 600 .86rem var(--display); display: flex; justify-content: space-between; padding: 4px 2px; text-transform: var(--head-case); }
.card { background: var(--surface-solid); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; text-align: left; display: grid; gap: 2px; font-size: .8rem; width: 100%; }
.card:hover { border-color: var(--accent); }
.card .m { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r-sm); padding: 9px 12px; }
.bulk select { width: auto; }
td.sel, th.sel { width: 36px; padding-right: 0; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.lines { width: 100%; border-collapse: collapse; }
.lines td, .lines th { padding: 6px; border-bottom: 1px solid var(--line); white-space: normal; max-width: none; }
.calc { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 5px; font-variant-numeric: tabular-nums; }
.calc div { display: flex; justify-content: space-between; gap: 12px; }
.calc .tot { border-top: 1px solid var(--line-2); padding-top: 7px; font-weight: 700; }
.pickrow { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.pickrow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow select, .pickrow input:not([type=checkbox]) { width: auto; max-width: 150px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.kv > div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.mini { font-size: .76rem; color: var(--muted); }
.ok-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
.att td { text-align: center; } .att td:first-child, .att th:first-child { text-align: left; }
.att button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; width: 34px; padding: 4px 0; font-weight: 700; }
.att button.P { background: var(--good-bg); color: var(--good); border-color: transparent; } .att button.A { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.att button.L { background: var(--warn-bg); color: var(--warn); border-color: transparent; } .att button.H { background: var(--info-bg); color: var(--info); border-color: transparent; }
.bars { display: grid; gap: 8px; }
.bars .r { display: grid; grid-template-columns: minmax(90px, 170px) 1fr auto; gap: 10px; align-items: center; font-size: .82rem; }
.bars .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars i { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; display: block; }
.bars i em { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.chain { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
.step { display: flex; gap: 9px; align-items: flex-start; padding: 9px 10px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.step[data-open] { cursor: pointer; } .step[data-open]:hover { border-color: var(--accent); }
.step > span:last-child { display: grid; min-width: 0; } .step b { font-size: .8rem; } .step .mini { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 .7rem var(--mono); background: var(--line-2); color: var(--muted); }
.step.ok .dot { background: var(--good); color: #fff; } .step.ok { background: var(--good-bg); border-color: transparent; }
.meter { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; } .meter em { display: block; height: 100%; background: var(--accent); }
.drawer.page { left: 268px; width: auto; border-left: 0; box-shadow: none; background: var(--canvas); z-index: 25; }
@media (min-width: 861px) { .scrim { display: none; } }
.drawer.page .dhead { background: var(--surface-solid); border-bottom: 1px solid var(--line); padding: 14px 28px; gap: 14px; flex-wrap: wrap; }
.dtitle { flex: 1; min-width: 0; display: grid; } .dtitle h3 { font: 700 1.35rem/1.2 var(--display); margin: 0; overflow-wrap: anywhere; }
.dactions { display: flex; gap: 8px; flex-wrap: wrap; }
.drawer.page .dbody { padding: 22px 28px 60px; }
.drawer.page .dfoot { display: none; }
.rec { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; align-items: start; }
.rec-tabs { display: grid; gap: 4px; position: sticky; top: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; box-shadow: var(--shadow); }
.rec-tabs button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 12px; border-radius: var(--r-sm); text-align: left; font-weight: 600; color: var(--muted); border-left: 3px solid transparent; }
.rec-tabs button:hover { color: var(--ink); background: var(--surface-2); }
.rec-tabs button[aria-selected="true"] { color: var(--ink); background: var(--accent-soft); border-left-color: var(--accent); }
.rec-tabs .n { margin-left: auto; font: 600 .7rem var(--mono); color: var(--accent); }
.rec-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; display: grid; gap: 16px; min-width: 0; box-shadow: var(--shadow); align-content: start; }
.rec-body .form, .rec-body .facts { grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
.fsec[hidden], [hidden] { display: none !important; }
.fsec { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; min-width: 0; } .fsec legend { padding: 0; margin-bottom: 4px; }
.tpl { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.tpl .panel { display: grid; gap: 8px; align-content: start; } .tpl .panel h2 { margin: 0; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 16px; }
.skin-card { border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px; text-align: left; display: grid; gap: 10px; }
.skin-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.skin-prev { height: 120px; border-radius: 10px; display: grid; grid-template-columns: 30% 1fr; overflow: hidden; }
.skin-prev .s { padding: 8px; display: grid; gap: 5px; align-content: start; } .skin-prev .s i { display: block; height: 6px; border-radius: 3px; opacity: .55; background: #fff; }
.skin-prev .c { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; } .skin-prev .c i { display: block; height: 30px; border-radius: 6px; }

@media (max-width: 1100px) { .track { width: min(300px, 34vw); } }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .drawer.page { left: 0; }
  .drawer.page .dhead, .drawer.page .dbody { padding-left: 16px; padding-right: 16px; }
  .rec { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .rec-tabs { display: flex; overflow-x: auto; position: static; padding: 6px; }
  .rec-tabs button { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
  .rec-tabs button[aria-selected="true"] { border-bottom-color: var(--accent); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); z-index: 30; transform: translateX(-105%); transition: transform .22s; padding-top: env(safe-area-inset-top, 0px); }
  body.navopen .side { transform: none; box-shadow: var(--shadow-lg); }
  body.navopen .navscrim { display: block; }
  .burger { display: grid; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { flex-wrap: wrap; gap: 10px; }
  .track { order: 3; width: 100%; }
  .who span { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 12px; grid-template-columns: 1fr; } .kpi .ic { display: none; } .kpi .l { grid-column: 1; } .kpi .v { font-size: 1.3rem; }
  .form, .facts, .quick .form { grid-template-columns: 1fr; }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pl { grid-template-columns: 1fr; }
  .board { grid-auto-columns: 80%; }
}
.navscrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 29; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* departments in the left rail */
.dept { margin: 2px 0; }
.dept.overview { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--side-line); }
.dept-h { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--side-sub); padding: 10px 10px 8px; border-radius: var(--r-sm); text-align: left; font: 700 .7rem/1 var(--font, inherit); letter-spacing: .14em; text-transform: uppercase; position: relative; }
.dept-h svg { width: 15px; height: 15px; flex: none; opacity: .7; }
.dept-h .chev { margin-left: auto; width: 13px; height: 13px; opacity: .5; transition: transform .2s; }
.dept-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.dept-h:hover, .dept.cur .dept-h { color: var(--side-head); }
.dept.cur .dept-h::before { content: ""; position: absolute; left: -6px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent-2); }
body[data-skin="executive"] .dept.cur .dept-h::before { background: #b8862b; }
body[data-skin="executive"] .dept-h svg { color: #d4a64a; opacity: .9; }
.dept-h .count { font: 600 .64rem var(--mono); letter-spacing: 0; background: #b8862b; color: #fff; padding: 1px 6px; border-radius: 9px; }

}

    const ok = await postJournal(today(), r.type + ' · ' + (r.party || '') + (r.link ? ' · ' + r.link : ''), L, 'Payment', r.ref);
    if (!ok) return false;

// ---- COD reconciliation ----
function codRecon() {
  const custs = uniq(S.data.shipments.filter(s => s.mode === 'COD').map(s => s.customer));
  const rows = custs.map(c => {
    const sh = S.data.shipments.filter(s => s.mode === 'COD' && lc(s.customer) === lc(c));
    const transit = sum(sh.filter(s => !['Delivered', 'RTO', 'Lost / damaged'].includes(stageOf('shipments', s))), s => s.cod);
    const collected = sum(sh.filter(s => stageOf('shipments', s) === 'Delivered'), s => s.codCollected != null ? s.codCollected : s.cod);
    const remitted = sum(S.data.payments.filter(p => p.type === 'COD remittance to client' && lc(p.party) === lc(c) && stageOf('payments', p) === 'Paid'), p => p.amount);
    const queued = sum(S.data.payments.filter(p => p.type === 'COD remittance to client' && lc(p.party) === lc(c) && stageOf('payments', p) === 'Pending'), p => p.amount);
    return { c, transit, collected, remitted, queued, due: r2(collected - remitted - queued) };
  });
  const riders = sum(S.data.payments.filter(p => p.type === 'COD collection' && stageOf('payments', p) === 'Pending'), p => p.amount);
  let h = '<p class="help">COD money: on the road, collected by riders, and owed to each client. "Remit" queues a payment to the client in Payments.</p><div class="kpis">' +
    '<div class="kpi"><span class="v">' + short(sum(rows, r => r.transit)) + '</span><span class="l">COD on undelivered shipments</span></div>' +
    '<div class="kpi ' + (riders ? 'alert' : '') + '"><span class="v">' + short(riders) + '</span><span class="l">Cash with riders, not deposited</span></div>' +
    '<div class="kpi"><span class="v">' + short(sum(rows, r => r.due)) + '</span><span class="l">Owed to clients, not remitted</span></div></div>';
  if (!rows.length) return h + '<div class="empty">No COD shipments yet.</div>';
  return h + '<div class="tablewrap"><table><thead><tr><th>Client</th><th class="num">On the road</th><th class="num">Collected</th><th class="num">Remitted</th><th class="num">Queued</th><th class="num">To remit</th><th></th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.c) + '</td><td class="num">' + money(r.transit) + '</td><td class="num">' + money(r.collected) + '</td><td class="num">' + money(r.remitted) + '</td><td class="num">' + money(r.queued) + '</td><td class="num"><b>' + money(r.due) + '</b></td><td>' + (writable() && r.due > 0 ? '<button class="btn small" type="button" data-remit="' + esc(r.c) + '|' + r.due + '">Remit</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>';
}

}

function reports() {
  const inRange = ms => { const d = dayOf(ms); return d >= S.from && d <= S.to; };
  const sh = S.data.shipments.filter(s => inRange(s.createdAt));
  const del = S.data.shipments.filter(s => stageOf('shipments', s) === 'Delivered' && inRange(s.deliveredAt));
  const ot = del.filter(onTime).length;
  const firstAttempt = del.filter(s => !s.attempts).length;
  const rto = S.data.shipments.filter(s => stageOf('shipments', s) === 'RTO' && inRange(s.updatedAt)).length;
  const tat = del.filter(s => s.createdAt).map(s => (s.deliveredAt - s.createdAt) / 864e5);
  const rev = sum(del, shipSub);
  const bars = (title, obj, fmt) => { const ks = Object.keys(obj).sort((a, b) => obj[b] - obj[a]).slice(0, 10); const mx = Math.max(1, ...ks.map(k => obj[k])); return '<section class="panel"><h2>' + title + '</h2>' + (ks.length ? '<div class="bars">' + ks.map(k => '<div class="r"><span title="' + esc(k) + '">' + esc(k) + '</span><i><em style="width:' + (obj[k] / mx * 100).toFixed(1) + '%"></em></i><b>' + (fmt ? fmt(obj[k]) : obj[k]) + '</b></div>').join('') + '</div>' : '<div class="empty">No data in this period.</div>') + '</section>'; };
  const group = (list, f, val) => { const o = {}; list.forEach(x => { const k = f(x) || '—'; o[k] = (o[k] || 0) + (val ? val(x) : 1); }); return o; };
  const riders = {}; S.data.drs.filter(d => stageOf('drs', d) === 'Closed' && inRange(d.updatedAt)).forEach(d => { const k = d.rider || '—'; riders[k] = riders[k] || { n: 0, d: 0 }; riders[k].n += (d.awbIds || []).length; riders[k].d += d.deliveredCount || 0; });
  const riderPct = {}; Object.keys(riders).forEach(k => { riderPct[k + ' (' + riders[k].d + '/' + riders[k].n + ')'] = Math.round(riders[k].d / Math.max(1, riders[k].n) * 100); });
  return periodBar() + '<div class="kpis">' +
    '<div class="kpi"><span class="v">' + sh.length + '</span><span class="l">Shipments booked</span></div>' +
    '<div class="kpi"><span class="v">' + del.length + '</span><span class="l">Delivered</span></div>' +
    '<div class="kpi ' + (del.length && ot / del.length >= 0.95 ? 'okay' : del.length ? 'alert' : '') + '"><span class="v">' + pct(ot, del.length) + '</span><span class="l">On-time delivery (OTD)</span></div>' +
    '<div class="kpi"><span class="v">' + pct(firstAttempt, del.length) + '</span><span class="l">First-attempt delivery</span></div>' +
    '<div class="kpi ' + (rto ? 'alert' : '') + '"><span class="v">' + pct(rto, del.length + rto) + '</span><span class="l">RTO rate (' + rto + ')</span></div>' +
    '<div class="kpi"><span class="v">' + (tat.length ? (sum(tat) / tat.length).toFixed(1) + ' d' : '—') + '</span><span class="l">Average booking → delivery</span></div>' +
    '<div class="kpi"><span class="v">' + short(rev) + '</span><span class="l">Revenue on delivered</span></div>' +
    '<div class="kpi"><span class="v">' + (del.length ? money(rev / del.length) : '—') + '</span><span class="l">Revenue per shipment</span></div></div>' +
    '<div class="grid2">' + bars('Revenue by customer', group(del, s => s.customer, shipSub), short) + bars('Shipments by destination city', group(sh, s => s.destCity || s.consignee)) + '</div>' +
    '<div class="grid2">' + bars('Shipments by zone', group(sh, s => shipPrice(s).zone)) + bars('Failed-delivery reasons', group(S.data.shipments.filter(s => s.ndrReason && inRange(s.updatedAt)), s => s.ndrReason)) + '</div>' +
    '<div class="grid2">' + bars('Rider delivery success %', riderPct, v => v + '%') + bars('IT tickets by category', group(S.data.tickets.filter(t => inRange(t.createdAt)), t => t.category)) + '</div>';
}

function bookingsChart(sh) {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(today(), -i));
  const counts = days.map(d => sh.filter(r => dayOf(r.createdAt) === d).length);
  const max = Math.max(4, ...counts); const step = max <= 8 ? 2 : Math.ceil(max / 4 / 5) * 5; const top = Math.ceil(max / step) * step;
  const W = 420, H = 170, Lp = 26, B = 22, T = 12, cw = (W - Lp) / days.length, bw = Math.max(6, cw - 8);
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = ''; for (let v = 0; v <= top; v += step) g += '<line class="grid" x1="' + Lp + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="tick" x="' + (Lp - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
  let bars = '';
  counts.forEach((n, i) => {
    const x = Lp + i * cw + (cw - bw) / 2, yy = y(n);
    bars += '<rect class="hit" x="' + (Lp + i * cw) + '" y="' + T + '" width="' + cw + '" height="' + (H - T - B) + '" fill="transparent" data-tip="' + esc(fmtDate(days[i]) + ': ' + n + ' booked') + '"/>';
    if (n > 0) bars += '<path class="bar" d="M' + x + ',' + y(0) + 'V' + (yy + 3) + 'q0,-3 3,-3h' + (bw - 6) + 'q3,0 3,3V' + y(0) + 'z" pointer-events="none"/>';
    if (i % 2 === 1) bars += '<text class="tick" x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + days[i].slice(8) + '/' + days[i].slice(5, 7) + '</text>';
  });
  return '<div class="chart"><svg viewBox="0 0 ' + (W + 4) + ' ' + H + '" role="img" aria-label="Shipments booked per day, last 14 days">' + g + bars + '</svg></div><p class="foot" style="margin:8px 0 0"><span>Today <b>' + counts[13] + '</b></span><span>14 days <b>' + sum(counts) + '</b></span></p>';
}
