/* SN People – HR for SN Logistics. Same look as the Punch app: light grey canvas, white rounded cards, green for "in", orange for "out". */
:root{--bg:#f2f3f7;--card:#fff;--ink:#101828;--ink2:#344054;--mute:#6b7280;--line:#e9ebf1;--soft:#f3f4f8;--in:#0c9b76;--in2:#25cf9f;--out:#f26a1b;--bad:#d92d20;--warn:#b54708;--info:#3557b5;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b0f;--card:#15181e;--ink:#f3f4f6;--ink2:#d0d5dd;--mute:#9aa1ad;--line:#252a33;--soft:#1d2129;--in:#2fd1a0;--in2:#6ff0c8;--out:#ff8a4c;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090b0f;--card:#15181e;--ink:#f3f4f6;--ink2:#d0d5dd;--mute:#9aa1ad;--line:#252a33;--soft:#1d2129;--in:#2fd1a0;--in2:#6ff0c8;--out:#ff8a4c;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--in)}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}.mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--in2),var(--in));color:#fff;display:grid;place-items:center;font:800 .85rem var(--disp)}
.brand b{font:800 1.05rem var(--disp)}.brand small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:9px 14px 9px 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
.hits{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px;display:grid;gap:2px;max-height:320px;overflow:auto}
.hits button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px}.hits button:hover{background:var(--soft)}
.ib{border:0;background:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink2)}.ib:hover{background:var(--soft)}.ib svg{width:20px;height:20px}
.dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--out);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px;border-radius:999px}.who:hover{background:var(--soft)}

.menu{position:absolute;right:14px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:6px;min-width:230px;display:grid;gap:2px;z-index:30}
.menu .h{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}.menu .h span{display:block;font-size:.76rem;color:var(--mute)}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 57px)}

.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:600}.nav a svg{width:18px;height:18px;flex:none;color:var(--mute)}
.nav a:hover{background:var(--soft)}.nav a[aria-current="page"]{background:color-mix(in srgb,var(--in) 12%,transparent);color:var(--in)}.nav a[aria-current="page"] svg{color:var(--in)}.nav a .n{margin-left:auto;background:var(--out);color:#fff;border-radius:9px;font-size:.7rem;padding:0 6px}
.nav a.ext::after{content:"↗";margin-left:auto;color:var(--mute);font-size:.8rem}
main{padding:22px clamp(14px,3vw,30px) 60px;min-width:0}.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph p{margin:4px 0 0;color:var(--mute)}.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}.card>h2{margin-bottom:12px;display:flex;align-items:center;gap:8px}.card>h2 .more{margin-left:auto;font:600 .82rem var(--body)}.card>h2 svg{width:20px;height:20px;flex:none;color:var(--in)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--in) 92%,#000),var(--in2));color:#fff}.hero p{color:rgba(255,255,255,.85);margin:4px 0 0}.hero .tiles .t{background:rgba(255,255,255,.14);color:#fff}.hero .tiles .t span{color:rgba(255,255,255,.8)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:10px}.t{background:var(--soft);border-radius:14px;padding:12px;display:grid;gap:2px;text-decoration:none;color:inherit;border:0;text-align:left}
.t b{font:800 1.45rem var(--disp);letter-spacing:-.02em}.t span{font-size:.78rem;color:var(--mute)}button.t:hover,a.t:hover{outline:2px solid var(--in)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--ink)}.btn:hover{border-color:var(--in)}

.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mt{margin-top:12px}.mute{color:var(--mute)}.small{font-size:.82rem}.empty{padding:26px;text-align:center;color:var(--mute);background:var(--soft);border-radius:14px}
.feed{display:grid;gap:12px}.post{border-left:3px solid var(--in);padding:2px 0 2px 12px}.post b{display:block}.post p{margin:4px 0;color:var(--ink2);white-space:pre-wrap}.post small{color:var(--mute)}
.list{display:grid;gap:8px}.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}.li .g1{flex:1;min-width:0}.li .g1 span{display:block;font-size:.8rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:center;font-weight:700}
.cal .d{min-height:66px;border-radius:12px;background:var(--soft);padding:6px 7px;font-size:.72rem;display:grid;align-content:space-between;border:2px solid transparent}.cal .d b{font-size:.85rem}.cal .d.today{border-color:var(--in)}

.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}.kan .col{background:var(--soft);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start}.kan .col h3{font-size:.85rem;display:flex;justify-content:space-between}
.kc{background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--sh);display:grid;gap:4px;font-size:.84rem}.kc select{border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--soft)}
.org{display:grid;gap:8px}.org ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--line);display:grid;gap:8px}.org>ul{border:0;padding:0}.oc{display:inline-flex;gap:10px;align-items:center;background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:8px 12px}.oc>div>span{display:block;font-size:.76rem;color:var(--mute)}.oc .av{display:grid}.org .rt{font-size:.72rem;color:var(--mute);margin:2px 0 0 4px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--in2),var(--in));border-radius:5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:10px}.kv div{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}.kv span{font-size:.74rem;color:var(--mute)}
#hback{display:none!important}
.burger{display:none}

.modesw{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}.modesw[hidden]{display:none}.modesw button{border:0;background:none;border-radius:999px;padding:6px 12px;font:700 .8rem var(--body);color:var(--mute);cursor:pointer}.modesw button[aria-pressed="true"]{background:var(--card);color:var(--in);box-shadow:0 1px 4px rgba(0,0,0,.12)}@media (max-width:560px){.modesw button{padding:5px 8px;font-size:.72rem}}
.notif{position:absolute;right:60px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);padding:6px;width:min(320px,92vw);z-index:30;display:grid;gap:2px}.notif[hidden]{display:none}.notif .h{padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line);margin-bottom:4px}.notif a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600}.notif a:hover{background:var(--soft)}.notif a svg{width:18px;height:18px;flex:none;color:var(--in)}.notif a .n{margin-left:auto;background:var(--bad,#d33);color:#fff;border-radius:99px;padding:0 7px;font-size:.72rem}.notif .e{padding:14px 12px;color:var(--mute)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.pc{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh);border-left:4px solid var(--line)}.pc.in{border-color:var(--in)}.pc.none{border-color:var(--warn,#e8a33d)}.pc.out{border-color:#64748b}.pc.off{border-color:#a78bfa}.pc b{display:block}.pc .st{font-weight:700;margin-top:4px}.pc .sb{font-size:.8rem;color:var(--mute)}
.btn svg{width:18px;height:18px;flex:none;vertical-align:-3px}.btn{display:inline-flex;align-items:center;gap:6px}
@media (max-width:560px){.top{gap:6px;padding:8px 10px}.top .brand img{width:32px!important;height:32px!important}.ib{width:34px;height:34px}.modesw{padding:2px}.modesw button{padding:5px 7px;font-size:.7rem}.search{flex:0 1 auto;min-width:0}}

<script>
(async function () {
'use strict';
/* ================= basics ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const r2 = v => Math.round(num(v) * 100) / 100;
const money = v => '₹' + num(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lc = s => String(s || '').toLowerCase();
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const ymNow = () => today().slice(0, 7);
const fmtD = k => k ? new Date(String(k).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtT = ms => ms ? new Date(ms).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const tm = ms => ms ? new Date(ms).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : '';

<script>
