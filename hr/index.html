:root{--bg:#f2f3f7;--card:#fff;--ink:#101828;--ink2:#344054;--mute:#6b7280;--line:#e9ebf1;--soft:#f3f4f8;--in:#0c9b76;--in2:#25cf9f;--out:#f26a1b;--bad:#d92d20;--warn:#b54708;--info:#3557b5;

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--in)}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}.mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--in2),var(--in));color:#fff;display:grid;place-items:center;font:800 .85rem var(--disp)}

      await save('hr_reviews/' + id, Object.assign({}, base, { cycle: cyc, self: { rating: num(val('rv-rate')), text: val('rv-text') }, mgr: (old && old.mgr) || null, s: 'Submitted' }), 'Review submitted'); return; }
    case 'tr-join': { const c = D.train.find(z => z._id === x); await save('hr_enrol/' + x + '_' + S.uid, Object.assign({}, base, { course: x, courseTitle: c ? c.title : '', s: 'Enrolled' }), 'Signed up'); return; }
    case 'hd-send': { if (!val('hd-sub')) { toast('Write a subject.'); return; } await save('hr_help/' + newId('hd'), Object.assign({}, base, { cat: val('hd-cat'), subject: val('hd-sub'), detail: val('hd-text'), s: 'Open' }), 'Sent to HR'); return; }
    case 'sx-send': { if (!val('sx-lwd')) { toast('Pick your last working day.'); return; } if (!confirm('Submit your resignation to HR?')) return; await save('hr_exits/' + newId('sx'), Object.assign({}, base, { lwdAsked: val('sx-lwd'), reason: val('sx-why'), text: val('sx-text'), s: 'Pending' }), 'Resignation submitted'); return; }
    case 'of-view': S.ofView = !S.ofView; render(); return;
    case 'of-print': { const o = D.offer.find(z => z._id === S.uid); if (o && window.OfferLetter) OfferLetter.print(o, { name: 'Movana Logistics' }); return; }
    case 'of-accept': { const o = D.offer.find(z => z._id === S.uid); if (!o || !confirm('Accept this offer on the terms in the letter?')) return; const b = Object.assign({}, o); delete b._id; b.status = 'Accepted'; b.acceptedAt = now; await save('punch_offer/' + S.uid, b, 'Offer accepted'); return; }
    case 'pp-open': S.open.person = x; render(); window.scrollTo(0, 0); return;
    case 'pp-close': S.open.person = null; render(); return;
    case 'an-add': { if (!val('an-title')) { toast('Write a title.'); return; } await save('hr_posts/' + newId('an'), { title: val('an-title'), body: val('an-body'), pin: !!val('an-pin'), by: S.uid, byName: S.me.name, at: now }, 'Posted'); return; }
    case 'ho-add': { if (!val('ho-date') || !val('ho-name')) { toast('Enter the date and holiday.'); return; } await save('hr_holidays/' + val('ho-date'), { date: val('ho-date'), name: val('ho-name'), by: S.uid, at: now }, 'Holiday added'); return; }
    case 'del': { if (!confirm('Delete this?')) return; await del(t.dataset.p); return; }
    case 'ap-ok': case 'ap-no': if (a === 'ap-no' && !confirm('Reject this request?')) return; await decide(x, a === 'ap-ok'); return;
    case 'jb-add': { if (!val('jb-title')) { toast('Enter the role.'); return; } await save('hr_jobs/' + newId('jb'), { title: val('jb-title'), dept: val('jb-dept'), loc: val('jb-loc'), openings: num(val('jb-n')) || 1, type: val('jb-type'), desc: val('jb-desc'), s: 'Open', by: S.uid, at: now }, 'Opening posted'); return; }
    case 'jb-toggle': { const j = D.jobs.find(z => z._id === x); if (!j) return; const b = Object.assign({}, j); delete b._id; b.s = j.s === 'Closed' ? 'Open' : 'Closed'; await save('hr_jobs/' + x, b); return; }
    case 'cd-add': { if (!val('cd-name')) { toast('Enter the name.'); return; } await save('hr_cands/' + newId('cd'), { name: val('cd-name'), mob: val('cd-mob'), email: val('cd-email'), job: val('cd-job'), source: val('cd-src'), note: val('cd-note'), stage: 'Applied', by: S.uid, at: now }, 'Candidate added'); return; }
    case 'goal-done': { const g = D.goals.find(z => z._id === x); if (!g) return; const b = Object.assign({}, g); delete b._id; b.s = 'Completed'; b.progress = 100; await save('hr_goals/' + x, b, 'Marked complete'); return; }
    case 'rv-final': { const r = D.reviews.find(z => z._id === x); if (!r) return; const b = Object.assign({}, r); delete b._id; b.mgr = { rating: num(document.querySelector('[data-mr="' + x + '"]').value), text: document.querySelector('[data-mt="' + x + '"]').value.trim(), by: S.uid, byName: S.me.name }; b.s = 'Final'; await save('hr_reviews/' + x, b, 'Review finalised'); return; }
    case 'tr-add': { if (!val('tr-title')) { toast('Enter a title.'); return; } await save('hr_training/' + newId('tr'), { title: val('tr-title'), date: val('tr-date'), mode: val('tr-mode'), trainer: val('tr-trainer'), seats: num(val('tr-seats')), desc: val('tr-desc'), s: 'Open', by: S.uid, at: now }, 'Session added'); return; }
    case 'tr-toggle': { const c = D.train.find(z => z._id === x); if (!c) return; const b = Object.assign({}, c); delete b._id; b.s = c.s === 'Closed' ? 'Open' : 'Closed'; await save('hr_training/' + x, b); return; }
    case 'tr-complete': { for (const en of D.enrol.filter(z => z.course === x && z.s === 'Enrolled')) { const b = Object.assign({}, en); delete b._id; b.s = 'Completed'; await save('hr_enrol/' + en._id, b); } toast('Marked attended'); return; }
    case 'st': { const c = t.dataset.c, k = { hr_expenses: 'exp', hr_exits: 'exits', hr_help: 'help' }[c], r = D[k].find(z => z._id === x); if (!r) return; const b = Object.assign({}, r); delete b._id; b.s = t.dataset.v; b.by = S.uid; b.byName = S.me.name; b.decidedAt = now; await save(c + '/' + x, b, b.s); return; }
    case 'sx-ok': { const r = D.exits.find(z => z._id === x); if (!r) return; const b = Object.assign({}, r); delete b._id; const l = document.querySelector('[data-lwd="' + x + '"]'); b.lwd = (l && l.value) || r.lwdAsked; b.s = 'Approved'; b.by = S.uid; b.decidedAt = now; await save('hr_exits/' + x, b, 'Resignation accepted'); return; }
    case 'hd-reply': { const r = D.help.find(z => z._id === x); if (!r) return; const b = Object.assign({}, r); delete b._id; b.reply = document.querySelector('[data-hr="' + x + '"]').value.trim(); if (!b.reply) { toast('Write a reply.'); return; } b.s = 'Resolved'; b.by = S.uid; b.byName = S.me.name; b.decidedAt = now; await save('hr_help/' + x, b, 'Replied'); return; }
  }
}
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'ym' || t.id === 'ym-sel') { S.ym = t.value || ymNow(); render(); return; }
  if (t.dataset.gp) { const g = D.goals.find(z => z._id === t.dataset.gp); if (!g) return; const b = Object.assign({}, g); delete b._id; b.progress = Math.max(0, Math.min(100, num(t.value))); await save('hr_goals/' + g._id, b, 'Progress saved'); return; }
  if (t.dataset.cs) { const c = D.cands.find(z => z._id === t.dataset.cs); if (!c) return; const b = Object.assign({}, c); delete b._id; b.stage = t.value; b.updatedAt = Date.now(); await save('hr_cands/' + c._id, b, 'Moved to ' + t.value); if (t.value === 'Hired') toast('Hired – create their Punch login and offer letter in the portal (New joiner).'); return; }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q-people') { S.q.people = t.value; render(); return; }
  if (t.id === 'q') { const q = lc(t.value.trim()), h = $('#hits'); if (!q) { h.hidden = true; return; } const L = D.emp.filter(e => lc([e.name, e.eid, e.desg].join(' ')).includes(q)).slice(0, 8);
    h.innerHTML = L.length ? L.map(e => '<button type="button" data-hit="' + esc(e._id) + '"><span class="av">' + esc(ini(e.name)) + '</span><span><b>' + esc(e.name) + '</b><br><span class="mute small">' + esc([e.eid, e.desg].filter(Boolean).join(' · ')) + '</span></span></button>').join('') : '<div class="mute small" style="padding:10px">No one found</div>'; h.hidden = false; }
});
addEventListener('keydown', ev => { if (ev.key === 'Escape') { $('#menu').hidden = true; $('#hits').hidden = true; document.body.classList.remove('navopen'); } });
})();
</script>
</body></html>
